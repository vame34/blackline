services:
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    depends_on:
      - php
    volumes:
      - ./:/var/www/html:delegated
      - ./docker/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    environment:
      DB_HOST: mariadb
      DB_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      APP_ENV: local
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./:/var/www/html:delegated
    ports:
      - "127.0.0.1:${APP_FPM_PORT:-9000}:9000"
    depends_on:
      - mariadb
    networks:
      - app

  reverb:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    environment:
      DB_HOST: mariadb
      DB_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      APP_ENV: local
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./:/var/www/html:delegated
    depends_on:
      - mariadb
      - redis
    command: sh -lc "php artisan reverb:start --host=0.0.0.0 --port=${REVERB_SERVER_PORT:-8081}"
    ports:
      - "127.0.0.1:${REVERB_SERVER_PORT:-8081}:${REVERB_SERVER_PORT:-8081}"
    networks:
      - app

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    environment:
      DB_HOST: mariadb
      DB_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      APP_ENV: local
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./:/var/www/html:delegated
    depends_on:
      - mariadb
      - redis
    command: sh -lc "php artisan schedule:work"
    networks:
      - app

  horizon:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    environment:
      DB_HOST: mariadb
      DB_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      APP_ENV: local
      QUEUE_CONNECTION: redis
      REDIS_CLIENT: predis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./:/var/www/html:delegated
    depends_on:
      - mariadb
      - redis
    command: sh -lc "php artisan horizon"
    networks:
      - app

  mariadb:
    image: mariadb:11.4
    ports:
      - "127.0.0.1:${DB_PORT:-33316}:3306"
    environment:
      MARIADB_DATABASE: "${DB_DATABASE:-blackline}"
      MARIADB_USER: "${DB_USERNAME:-blackline}"
      MARIADB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env}"
      MARIADB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}"
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - app

  node:
    image: node:20-alpine
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html:delegated
    command: sh -lc "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "127.0.0.1:${VITE_PORT:-5173}:5173"
    networks:
      - app

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    networks:
      - app

volumes:
  mariadb_data:

networks:
  app:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_icc: "true"
      com.docker.network.bridge.enable_ip_masquerade: "true"
